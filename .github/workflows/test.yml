name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest importers/ -v --cov=importers --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage
          path: coverage.xml

  integration-tests:
    name: Integration Tests (Local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start Supabase Local Stack
        run: supabase start

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Integration Tests
        run: |
          python -m pytest tests/integration -v

  deno-tests:
    name: Deno Tests & Typed Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check index.ts
        working-directory: supabase/functions/alexandria
        run: deno check index.ts

      - name: Run typed test (tools/telemetry.test.ts)
        working-directory: supabase/functions/alexandria
        run: deno test --allow-all tools/telemetry.test.ts
        env:
          SUPABASE_URL: http://localhost:5432
          SUPABASE_SERVICE_ROLE_KEY: test-key
          LOCAL_SUPABASE_URL: http://localhost:5432
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: test-key
          LOCAL_SUPABASE_ANON_KEY: test-anon-key
          MCP_ACCESS_KEY: test
          OPENROUTER_API_KEY: test
          EMBEDDING_MODEL: qwen/qwen3-embedding-8b

      - name: Run all Deno tests
        working-directory: supabase/functions/alexandria
        run: deno test --allow-all .
        env:
          SUPABASE_URL: http://localhost:5432
          SUPABASE_SERVICE_ROLE_KEY: test-key
          LOCAL_SUPABASE_URL: http://localhost:5432
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: test-key
          LOCAL_SUPABASE_ANON_KEY: test-anon-key
          MCP_ACCESS_KEY: test
          OPENROUTER_API_KEY: test
          EMBEDDING_MODEL: qwen/qwen3-embedding-8b
